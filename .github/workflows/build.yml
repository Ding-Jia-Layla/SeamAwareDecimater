name: build-windows

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Download libigl and Eigen
        shell: bash
        run: |
          cd ..
          git clone --depth 1 --branch v2.0.0 --recursive https://github.com/libigl/libigl.git
          git clone --depth 1 --branch 3.3.7 https://gitlab.com/libeigen/eigen.git

      - name: Patch circulation calls (add F argument)
        shell: bash
        run: |
          echo "=== before ==="
          grep -n "circulation(" collapse_edge_seam.cpp || true
          perl -0pi -e 's/\bcirculation\(\s*([^,()]+?)\s*,\s*([^,()]+?)\s*,(?!\s*F\s*,)/circulation($1, $2, F,/g' collapse_edge_seam.cpp
          echo "=== after ==="
          grep -n "circulation(" collapse_edge_seam.cpp || true
          echo "=== libigl circulation signature ==="
          grep -n -A8 "IGL_INLINE" ../libigl/include/igl/circulation.h | head -40

      - name: Configure
        shell: pwsh
        run: |
          $LIBIGL = (Resolve-Path ..\libigl).Path -replace '\\','/'
          $EIGEN  = (Resolve-Path ..\eigen).Path  -replace '\\','/'
          $env:LIBIGL = $LIBIGL
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DLIBIGL_DIR=$LIBIGL" `
            "-DLIBIGL_INCLUDE_DIR=$LIBIGL/include" `
            "-DEIGEN3_INCLUDE_DIR=$EIGEN" `
            "-DEIGEN_INCLUDE_DIR=$EIGEN" `
            "-DCMAKE_PREFIX_PATH=$EIGEN" `
            "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /W0 /GR /EHsc /D_USE_MATH_DEFINES /DNOMINMAX /bigobj /MP"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: decimater-windows
          path: build/**/*.exe
