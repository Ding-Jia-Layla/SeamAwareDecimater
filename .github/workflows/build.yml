name: build-windows

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Download Eigen
        shell: bash
        run: |
          cd ..
          git clone --depth 1 --branch 3.3.7 https://gitlab.com/libeigen/eigen.git

      - name: Try libigl versions and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $EIGEN = (Resolve-Path ..\eigen).Path -replace '\\','/'
          $tags = @('v2.1.0', 'v2.2.0', 'v2.3.0')
          $ok = $false

          foreach ($t in $tags) {
            Write-Host ""
            Write-Host "################ Trying libigl $t ################"
            if (Test-Path ..\libigl) { Remove-Item -Recurse -Force ..\libigl }
            if (Test-Path build)     { Remove-Item -Recurse -Force build }

            git clone --depth 1 --branch $t https://github.com/libigl/libigl.git ../libigl 2>&1 | Out-Host
            $LIBIGL = (Resolve-Path ..\libigl).Path -replace '\\','/'
            $env:LIBIGL = $LIBIGL

            Write-Host "--- circulation.h signature in $t ---"
            Get-Content ..\libigl\include\igl\circulation.h | Select-String -Pattern "IGL_INLINE|const " | Out-Host

            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
              "-DLIBIGL_DIR=$LIBIGL" `
              "-DLIBIGL_INCLUDE_DIR=$LIBIGL/include" `
              "-DEIGEN3_INCLUDE_DIR=$EIGEN" `
              "-DEIGEN_INCLUDE_DIR=$EIGEN" `
              "-DCMAKE_PREFIX_PATH=$EIGEN" `
              "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /W0 /GR /EHsc /D_USE_MATH_DEFINES /DNOMINMAX /bigobj /MP"
            if ($LASTEXITCODE -ne 0) { Write-Host ">>> Configure FAILED with $t"; continue }

            cmake --build build --config Release
            if ($LASTEXITCODE -eq 0) {
              Write-Host ">>> SUCCESS with libigl $t"
              $ok = $true
              break
            }
            Write-Host ">>> Build FAILED with $t"
          }

          if (-not $ok) { Write-Host "All libigl versions failed"; exit 1 }
          exit 0

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: decimater-windows
          path: build/**/*.exe
